name: Paper A1 turbine curve inventory
on:
  pull_request:
    paths:
      - "scripts/paper_a1_e4_curve_inventory.py"
      - ".github/workflows/paper-a1-curve-inventory.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install atlite==0.4.1 pandas
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45900246129
          name: wind-parameter-coverage
          path: inputs/wind
      - run: python scripts/paper_a1_e4_curve_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: turbine-curve-inventory
          path: results/curve_inventory/
