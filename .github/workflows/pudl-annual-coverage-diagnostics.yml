name: Project A PUDL annual coverage diagnostics

on:
  push:
    paths:
      - "scripts/audit_pudl_annual_coverage.py"
      - "tests/test_audit_pudl_annual_coverage.py"
      - "scripts/build_pudl_annual_eia860_evidence_matrix.py"
      - "tests/test_build_pudl_annual_eia860_evidence_matrix.py"
      - "scripts/run_pudl_annual_evidence_pipeline.py"
      - "tests/test_run_pudl_annual_evidence_pipeline.py"
      - ".github/workflows/pudl-annual-coverage-diagnostics.yml"
      - ".github/workflows/pudl-pinned-source-preflight.yml"
  pull_request:
    paths:
      - "scripts/audit_pudl_annual_coverage.py"
      - "tests/test_audit_pudl_annual_coverage.py"
      - "scripts/build_pudl_annual_eia860_evidence_matrix.py"
      - "tests/test_build_pudl_annual_eia860_evidence_matrix.py"
      - "scripts/run_pudl_annual_evidence_pipeline.py"
      - "tests/test_run_pudl_annual_evidence_pipeline.py"
      - ".github/workflows/pudl-annual-coverage-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:

  pinned-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DuckDB
        run: python -m pip install 'duckdb>=1.4,<3'
      - name: Probe pinned annual Parquet schema and report years
        run: |
          python - <<'PY'
          import duckdb, json
          release = "v2026.11.0"
          url = f"https://s3.us-west-2.amazonaws.com/pudl.catalyst.coop/{release}/out_eia__yearly_generators.parquet"
          con = duckdb.connect()
          con.execute("CREATE SECRET pudl_public_s3 (TYPE s3, PROVIDER config, REGION 'us-west-2', URL_STYLE 'path')")
          cols = [r[0] for r in con.execute("DESCRIBE SELECT * FROM read_parquet(?)", [url]).fetchall()]
          required = {"plant_id_eia", "generator_id", "report_date"}
          assert required.issubset(cols), f"Missing columns: {required-set(cols)}"
          counts = con.execute(
              "SELECT year(report_date), count(*) FROM read_parquet(?) "
              "WHERE year(report_date) BETWEEN 2023 AND 2025 GROUP BY 1 ORDER BY 1",
              [url]).fetchall()
          print(json.dumps({"release": release, "source_url": url,
              "rows_by_year": counts, "empirical_dispatch_approved": False}, indent=2))
          assert {row[0] for row in counts} == {2023, 2024, 2025}
          import csv
          with open("data/pudl/project_a_pudl_29_targets.csv", newline="") as stream:
              targets = list(csv.DictReader(stream))
          assert len(targets) == 29
          con.execute("CREATE TEMP TABLE target_keys (plant_id_eia INTEGER, generator_id VARCHAR)")
          con.executemany("INSERT INTO target_keys VALUES (?, ?)",
              [(int(t["plant_id_eia"]), t["generator_id"]) for t in targets])
          result = con.execute("""
              WITH annual AS (
                SELECT year(report_date) AS yr, plant_id_eia,
                       trim(cast(generator_id AS VARCHAR)) AS generator_id
                FROM read_parquet(?)
                WHERE year(report_date) BETWEEN 2023 AND 2025
              ), matched AS (
                SELECT a.yr, t.plant_id_eia, t.generator_id,
                       COUNT(*) AS matches
                FROM target_keys t JOIN annual a
                  ON a.plant_id_eia = t.plant_id_eia
                 AND a.generator_id = t.generator_id
                GROUP BY 1, 2, 3
              )
              SELECT yr, COUNT(*) AS exact_keys, SUM(matches) AS matched_rows
              FROM matched GROUP BY 1 ORDER BY 1
          """, [url]).fetchall()
          print("TARGET_29_EXACT_MATCH_COUNTS=" + json.dumps(result))
          assert all(int(r[1]) <= 29 for r in result)
          plant_results = con.execute("""
              WITH annual_plants AS (
                SELECT DISTINCT year(report_date) AS yr, plant_id_eia
                FROM read_parquet(?)
                WHERE year(report_date) BETWEEN 2023 AND 2025
              )
              SELECT y.yr,
                COUNT(DISTINCT CASE WHEN a.plant_id_eia IS NOT NULL THEN t.plant_id_eia END) AS matched_plants,
                COUNT(CASE WHEN a.plant_id_eia IS NOT NULL THEN 1 END) AS target_generators_at_present_plants
              FROM target_keys t CROSS JOIN (VALUES (2023),(2024),(2025)) y(yr)
              LEFT JOIN annual_plants a ON a.yr=y.yr AND a.plant_id_eia=t.plant_id_eia
              GROUP BY 1 ORDER BY 1
          """, [url]).fetchall()
          print("TARGET_PLANT_LEVEL_COVERAGE=" + json.dumps(plant_results))
          # One row per target/year: do not confuse missing keys with commissioning.
          evidence = con.execute("""
              WITH annual AS (
                SELECT DISTINCT year(report_date) AS yr, plant_id_eia,
                  trim(cast(generator_id AS VARCHAR)) AS generator_id
                FROM read_parquet(?)
                WHERE year(report_date) BETWEEN 2023 AND 2025
              ),
              target_year AS (
                SELECT y.yr, t.plant_id_eia, t.generator_id
                FROM target_keys t CROSS JOIN (VALUES (2023),(2024),(2025)) y(yr)
              )
              SELECT t.yr, t.plant_id_eia, t.generator_id,
                CASE WHEN EXISTS (
                  SELECT 1 FROM annual a WHERE a.yr=t.yr
                    AND a.plant_id_eia=t.plant_id_eia
                    AND a.generator_id=t.generator_id
                ) THEN 'exact_generator_record'
                WHEN EXISTS (
                  SELECT 1 FROM annual a WHERE a.yr=t.yr
                    AND a.plant_id_eia=t.plant_id_eia
                ) THEN 'plant_present_generator_missing'
                ELSE 'plant_missing_from_annual_table' END AS classification
              FROM target_year t ORDER BY t.yr, t.plant_id_eia, t.generator_id
          """, [url]).fetchall()
          assert len(evidence) == 87
          from collections import Counter
          print("TARGET_87_CLASSIFICATIONS=" + json.dumps({
              str(year): dict(Counter(r[3] for r in evidence if r[0] == year))
              for year in (2023, 2024, 2025)}, sort_keys=True))
          import pathlib
          out = pathlib.Path("pudl_29_target_87_year_diagnostics.json")
          out.write_text(json.dumps({
              "release": release, "source_url": url,
              "source_kind": "PUDL_annual_generators",
              "records": [dict(year=r[0], plant_id_eia=r[1],
                  generator_id=r[2], classification=r[3]) for r in evidence],
              "physical_commissioning_verified": False,
              "empirical_dispatch_approved": False}, indent=2) + "\\n")



          PY
      - name: Upload descriptive annual coverage diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pudl-29-target-87-year-diagnostics
          path: pudl_29_target_87_year_diagnostics.json
          retention-days: 30
  coverage-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test fail-closed coverage semantics
        run: python -m pytest -q tests/test_audit_pudl_annual_coverage.py tests/test_build_pudl_annual_eia860_evidence_matrix.py tests/test_run_pudl_annual_evidence_pipeline.py

# The live preflight queries the fixed PUDL Parquet release and uploads only\n# descriptive 29-target/87-year coverage evidence, not raw source data.\n# This does not verify physical commissioning or approve dispatch.
