name: R02a live EIA cross-endpoint source audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r02a-live-cross-endpoint.yml'
      - 'src/multiyear_energy_validation/eia_cross_endpoint_live.py'
      - 'src/multiyear_energy_validation/eia_cross_endpoint_audit.py'
      - 'src/multiyear_energy_validation/eia_cross_endpoint_cli.py'
      - 'tests/test_eia_cross_endpoint_audit.py'
      - 'tests/test_eia_cross_endpoint_cli.py'
      - 'tests/test_eia_cross_endpoint_live.py'
      - 'tests/test_eia_historical_fuel_fixture.py'
      - 'tests/fixtures/r02a_eia_fuel_historical_20250731.json'
      - 'pyproject.toml'

jobs:
  source-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Gate live EIA calls on offline regression suite
        id: regression
        run: python -m pytest -q tests/test_eia_cross_endpoint_audit.py tests/test_eia_cross_endpoint_cli.py tests/test_eia_cross_endpoint_live.py tests/test_eia_historical_fuel_fixture.py
      - name: Fetch and reconcile bounded EIA sources
        id: fetch
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          test -n "$EIA_API_KEY"
          python -m multiyear_energy_validation.eia_cross_endpoint_live --output-dir outputs/r02a-cross-endpoint
      - name: Archive raw responses and audit (private repo)
        id: archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r02a-cross-endpoint-raw-audit
          path: outputs/r02a-cross-endpoint/
          if-no-files-found: error
          retention-days: 14
      - name: Record machine-verifiable run outcome on R02a issue
        if: always()
        uses: actions/github-script@v7
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "R02a automated live audit run receipt",
              `Run: ${runUrl}`,
              `Commit: \`${context.sha}\``,
              `Offline regression: ${process.env.REGRESSION_OUTCOME}`,
              `Live endpoint fetch/reconcile: ${process.env.FETCH_OUTCOME}`,
              `Raw artifact upload: ${process.env.ARCHIVE_OUTCOME}`,
              "Note: This receipt reports workflow step outcomes only. Review artifact hashes and raw rows before scientific acceptance.",
              "Empirical dispatch remains blocked."
            ].join("\n\n");
            await github.rest.issues.createComment({
              owner, repo, issue_number: 1, body
            });
