name: EIA CISO 2024 missing-day crosscheck
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/multiyear_energy_validation/eia_gap_crosscheck.py'
      - '.github/workflows/eia-gap-crosscheck.yml'
permissions:
  contents: read
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test -n "$EIA_API_KEY"
      - run: PYTHONPATH=src python -m multiyear_energy_validation.eia_gap_crosscheck
