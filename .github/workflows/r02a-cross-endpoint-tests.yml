name: R02a EIA cross-endpoint reconciliation tests

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r02a-cross-endpoint-tests.yml'
      - 'src/multiyear_energy_validation/eia_cross_endpoint_audit.py'
      - 'tests/test_eia_cross_endpoint_audit.py'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/r02a-cross-endpoint-tests.yml'
      - 'src/multiyear_energy_validation/eia_cross_endpoint_audit.py'
      - 'tests/test_eia_cross_endpoint_audit.py'
      - 'pyproject.toml'

jobs:
  reconcile-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research package and tests
        run: python -m pip install -e '.[test]'
      - name: Run cross-endpoint regression tests
        run: python -m pytest -q tests/test_eia_cross_endpoint_audit.py
