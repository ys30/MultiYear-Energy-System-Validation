name: Project A real PUDL annual cohort extraction

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/project-a-pudl-annual-real.yml"
      - "scripts/extract_pudl_annual_real.py"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb
      - name: Query pinned PUDL annual Parquet (no synthetic fallback)
        run: |
          python scripts/extract_pudl_annual_real.py \
            --targets data/pudl/project_a_pudl_29_targets.csv \
            --release v2026.11.0 \
            --output-dir pudl-real-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-a-pudl-annual-real-${{ github.run_id }}
          path: pudl-real-output/
          if-no-files-found: warn
