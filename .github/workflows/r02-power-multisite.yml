name: R02 NASA POWER three-site weather pilot
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/multiyear_energy_validation/power_multisite_pilot.py'
      - '.github/workflows/r02-power-multisite.yml'
permissions:
  contents: read
jobs:
  multisite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH=src python -m multiyear_energy_validation.power_multisite_pilot
      - uses: actions/upload-artifact@v4
        with:
          name: r02-nasa-power-three-site-pilot
          path: artifacts/r02_weather_multisite/
          if-no-files-found: error
          retention-days: 30
