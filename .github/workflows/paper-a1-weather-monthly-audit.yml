name: Paper A1 monthly weather independent audit
on:
  pull_request:
    paths:
      - ".github/workflows/paper-a1-weather-monthly-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas xarray zarr gcsfs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45856946706
          name: renewable-resource-weights
          path: inputs/weights
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45872037214
          pattern: monthly-weather-*
          path: inputs/weather/pilot
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45873772010
          pattern: monthly-weather-*
          path: inputs/weather/batch1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45877926960
          pattern: monthly-weather-*
          path: inputs/weather/batch2
      - run: python scripts/paper_a1_e4_monthly_weather_audit.py --root inputs/weather --weights inputs/weights/resource_grid_weights.csv --output results/monthly_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-weather-audit
          path: results/
