name: Paper A1 bulk cohort extraction
on:
  push:
    paths:
      - ".github/workflows/paper-a1-bulk-extract.yml"
      - "scripts/paper_a1_e4_bulk_extract.py"
  pull_request:
    paths:
      - ".github/workflows/paper-a1-bulk-extract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - run: python scripts/paper_a1_e4_bulk_extract.py --output-dir results/bulk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-selected-cohorts
          path: results/bulk/
