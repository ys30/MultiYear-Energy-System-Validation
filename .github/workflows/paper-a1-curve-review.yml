name: Paper A1 curve review queue
on:
  pull_request:
    paths:
      - "scripts/paper_a1_e4_curve_review.py"
      - ".github/workflows/paper-a1-curve-review.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45905936669
          name: turbine-curve-inventory
          path: inputs/inventory
      - run: python scripts/paper_a1_e4_curve_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: turbine-curve-review
          path: results/curve_review/
