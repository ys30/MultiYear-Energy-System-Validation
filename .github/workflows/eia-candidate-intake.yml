name: EIA candidate intake (manual and weekly)

on:
  schedule:
    - cron: '23 15 * * 1'
  workflow_dispatch:
    inputs:
      respondent:
        description: "EIA respondent code; verify via live metadata"
        required: true
        default: CISO
      start:
        description: "EIA API start period, e.g. 2021-01-01T00"
        required: true
        default: "2021-01-01T00"
      end:
        description: "EIA API end period, e.g. 2021-01-01T23"
        required: true
        default: "2021-01-01T23"

jobs:
  candidate-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Check API secret configured
        run: |
          if [ -z "$EIA_API_KEY" ]; then
            echo "Missing EIA_API_KEY repository secret"
            exit 1
          fi
      - name: Resolve scheduled period (7-day reporting lag)
        id: period
        env:
          REQUEST_RESPONDENT: ${{ inputs.respondent }}
          REQUEST_START: ${{ inputs.start }}
          REQUEST_END: ${{ inputs.end }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "respondent=CISO" >> "$GITHUB_OUTPUT"
            echo "start=$(date -u -d '8 days ago' +%Y-%m-%dT00)" >> "$GITHUB_OUTPUT"
            echo "end=$(date -u -d '8 days ago' +%Y-%m-%dT23)" >> "$GITHUB_OUTPUT"
          else
            echo "respondent=$REQUEST_RESPONDENT" >> "$GITHUB_OUTPUT"
            echo "start=$REQUEST_START" >> "$GITHUB_OUTPUT"
            echo "end=$REQUEST_END" >> "$GITHUB_OUTPUT"
          fi
      - name: Download candidate only (not validated observations)
        env:
          RESPONDENT: ${{ steps.period.outputs.respondent }}
          START: ${{ steps.period.outputs.start }}
          END: ${{ steps.period.outputs.end }}
        run: |
          python -m multiyear_energy_validation.download_cli \
            --respondent "$RESPONDENT" --start "$START" --end "$END" \
            --output-dir outputs/eia-candidate --max-rows 20000
      - name: Upload private candidate snapshot
        uses: actions/upload-artifact@v4
        with:
          name: eia-candidate-unverified
          path: outputs/eia-candidate/
          retention-days: 7
