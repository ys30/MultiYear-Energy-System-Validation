name: EIA-860 annual source intake
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia860-source-intake.yml'
      - 'src/multiyear_energy_validation/eia860_source.py'
      - 'src/multiyear_energy_validation/eia860_fleet.py'
      - 'src/multiyear_energy_validation/pypsa_asset_staging.py'
jobs:
  inventory:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        year: [2024, 2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workbook reader
        run: python -m pip install -e . "openpyxl>=3.1,<4"
      - name: Download official ZIP and inventory workbook layouts
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python src/multiyear_energy_validation/eia860_source.py --year "$YEAR" --output "outputs/eia860/$YEAR"
      - name: Audit CAISO operable nameplate capacity
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import os
          from multiyear_energy_validation.eia860_fleet import audit_ciso_operable
          y = int(os.environ["YEAR"])
          audit_ciso_operable(f"outputs/eia860/{y}/eia860{y}.zip", y, f"outputs/eia860/{y}")
          PY
      - name: Record empirical dispatch readiness (fail-closed)
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from multiyear_energy_validation.dispatch_readiness import assess_dispatch_readiness
          year = int(os.environ["YEAR"])
          base = Path(f"outputs/eia860/{year}")
          result = assess_dispatch_readiness(base / "ciso_fleet_audit.json", {},
                                             base / "dispatch_readiness.json")
          assert not result["empirical_dispatch_ready"]
          print("EMPIRICAL_DISPATCH_READINESS=" + json.dumps(result, sort_keys=True))
          PY
      - name: Install PyPSA for conservative asset staging
        run: python -m pip install "pypsa>=0.35,<2"
      - name: Stage real generator inventory in PyPSA (no optimization)
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import os
          from multiyear_energy_validation.pypsa_asset_staging import build_asset_staging_network
          year = int(os.environ["YEAR"])
          base = f"outputs/eia860/{year}"
          build_asset_staging_network(
              f"{base}/op_nonbattery_candidates.csv",
              f"{base}/op_battery_candidates.csv",
              f"{base}/ciso_asset_staging.nc")
          PY
      - name: Upload source audit (private workflow artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eia860-source-inventory-${{ matrix.year }}
          path: outputs/eia860/${{ matrix.year }}/
          if-no-files-found: warn
          retention-days: 30
