name: Paper A1 D4 PV loss sensitivity
on:
  pull_request:
    paths:
      - "scripts/paper_a1_e4_loss_sensitivity.py"
      - ".github/workflows/paper-a1-loss-sensitivity.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sensitivity:
    strategy:
      matrix:
        year: [2024, 2025]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45951342303
          name: same-fleet-${{ matrix.year }}
          path: inputs/same
      - run: python scripts/paper_a1_e4_loss_sensitivity.py --year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        with:
          name: pv-loss-sensitivity-${{ matrix.year }}
          path: results/loss_sensitivity/
