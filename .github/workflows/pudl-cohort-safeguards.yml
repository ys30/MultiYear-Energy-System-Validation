name: Project A PUDL cohort safeguards

on:
  push:
    paths:
      - "data/pudl/project_a_pudl_29_targets.csv"
      - "scripts/pudl_pre2025_entrant_crosscheck.py"
      - "scripts/verify_pudl_targets_against_artifact.py"
      - "tests/test_pudl_pre2025_entrant_crosscheck.py"
      - "tests/test_eia860_source_gates.py"
      - "scripts/verify_eia860_source_gates.py"
      - "scripts/audit_official_eia860_workbooks.py"
      - "scripts/extract_official_eia860_ciso.py"
      - "scripts/reconcile_official_eia860_op_totals.py"
      - "scripts/reconcile_official_eia860_transition_bridge.py"
      - "tests/test_reconcile_official_eia860_op_totals.py"
      - "tests/test_reconcile_official_eia860_transition_bridge.py"
      - "tests/test_extract_official_eia860_ciso_missing_rows.py"
      - "scripts/verify_official_eia860_helms.py"
      - "scripts/verify_official_eia860_29_entrants.py"
      - "tests/test_verify_official_eia860_29_entrants.py"
      - "tests/test_verify_official_eia860_helms.py"
      - "tests/test_official_eia860_workbook_schema.py"
      - ".github/workflows/pudl-cohort-safeguards.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cohort-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest openpyxl
      - name: Validate 29-row cohort and changelog fixtures
        run: python -m pytest -q tests/test_pudl_pre2025_entrant_crosscheck.py tests/test_eia860_source_gates.py tests/test_official_eia860_workbook_schema.py tests/test_reconcile_official_eia860_op_totals.py tests/test_reconcile_official_eia860_transition_bridge.py tests/test_extract_official_eia860_ciso_missing_rows.py tests/test_verify_official_eia860_helms.py tests/test_verify_official_eia860_29_entrants.py

  archived-source-reconciliation:
    needs: cohort-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download archived fleet transition artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/artifacts/13295023796/zip" \
            > fleet-transition-artifact.zip
          unzip -t fleet-transition-artifact.zip
      - name: Independently reconcile cohort against source artifact
        run: |
          python scripts/verify_pudl_targets_against_artifact.py \
            --artifact fleet-transition-artifact.zip
      - name: Verify source provenance and fail-closed dispatch gates
        run: |
          python scripts/verify_eia860_source_gates.py \
            --artifact fleet-transition-artifact.zip
      - name: Reject tampered source metadata (negative control)
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys, zipfile
          original = pathlib.Path("fleet-transition-artifact.zip")
          modified = pathlib.Path("tampered-fleet-transition-artifact.zip")
          with zipfile.ZipFile(original) as src, zipfile.ZipFile(modified, "w") as dst:
              for name in src.namelist():
                  payload = src.read(name)
                  if name == "2025/source_inventory.json":
                      obj = json.loads(payload)
                      obj["sha256"] = "0" * 64
                      payload = json.dumps(obj).encode()
                  dst.writestr(name, payload)
          result = subprocess.run(
              [sys.executable, "scripts/verify_eia860_source_gates.py",
               "--artifact", str(modified)], capture_output=True, text=True)
          assert result.returncode != 0, "Tampered metadata was incorrectly accepted"
          print("PASS: tampered source SHA256 rejected")
          PY

  official-eia860-archive-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download official 2024 and 2025 EIA-860 archives
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 \
            --max-time 600 \
            "https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602024.zip" \
            --output eia8602024.zip
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 \
            --max-time 600 \
            "https://www.eia.gov/electricity/data/eia860/xls/eia8602025.zip" \
            --output eia8602025.zip
      - name: Verify official archive checksums and ZIP integrity
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '0aaae04812cd4ab87a3e346bdf93848a3cc15053fd4dc2a4cf82d2aeac95f12b' eia8602024.zip \
            '2b27929d26cc1da9ad6a530da1cac6718cd8496098ee560c4d47cfffd96d08ba' eia8602025.zip \
            | sha256sum --check --strict
          unzip -tq eia8602024.zip
          unzip -tq eia8602025.zip
          echo "PASS: official EIA-860 ZIP bytes match pinned SHA256"
      - name: Record reproducible official archive manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          manifest = {"schema_version": 1, "scope": "official_archive_byte_integrity_only",
                      "fleet_validated": False, "ba_mapping_validated": False,
                      "empirical_dispatch_approved": False, "archives": {}}
          for year in (2024, 2025):
              path = pathlib.Path(f"eia860{year}.zip")
              with zipfile.ZipFile(path) as z:
                  members = [{"filename": i.filename, "uncompressed_bytes": i.file_size,
                              "crc32": f"{i.CRC:08x}"} for i in z.infolist() if not i.is_dir()]
              manifest["archives"][str(year)] = {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "archive_bytes": path.stat().st_size, "members": members}
          # Inspect embedded Excel workbook sheet names without asserting fleet validation.
          import io, xml.etree.ElementTree as ET
          for year in (2024, 2025):
              archive = pathlib.Path(f"eia860{year}.zip")
              workbooks = []
              with zipfile.ZipFile(archive) as outer:
                  for info in outer.infolist():
                      if not info.filename.lower().endswith(".xlsx"):
                          continue
                      with zipfile.ZipFile(io.BytesIO(outer.read(info))) as inner:
                          root = ET.fromstring(inner.read("xl/workbook.xml"))
                          ns = {"m": "http://schemas.openxmlformats.org/spreadsheetml/2006/main"}
                          sheets = [e.attrib["name"] for e in root.findall(".//m:sheets/m:sheet", ns)]
                      workbooks.append({"filename": info.filename, "sheets": sheets})
              manifest["archives"][str(year)]["workbook_sheets"] = workbooks
          for year in (2024, 2025):
              names = [w["filename"].lower() for w in manifest["archives"][str(year)]["workbook_sheets"]]
              assert any("plant" in n for n in names), f"{year}: Plant workbook missing"
              assert any("generator" in n for n in names), f"{year}: Generator workbook missing"
          assert all(manifest["archives"][str(y)]["workbook_sheets"] for y in (2024, 2025)), (
              "No Excel workbooks detected in official archive")
          pathlib.Path("official-eia860-integrity-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Inspect original Plant and Generator sheet schemas
        run: |
          python -m pip install openpyxl
          python scripts/audit_official_eia860_workbooks.py \
            eia8602024.zip eia8602025.zip \
            --output official-eia860-workbook-schema.json
      - name: Archive workbook schema diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-a-official-eia860-workbook-schema
          path: official-eia860-workbook-schema.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Extract original CISO Plant-BA and Generator rows
        run: |
          python scripts/extract_official_eia860_ciso.py --archive eia8602024.zip --year 2024 --out-dir official-extract
          python scripts/extract_official_eia860_ciso.py --archive eia8602025.zip --year 2025 --out-dir official-extract
      - name: Independently reconcile original-workbook OP inventory
        id: official_check_1
        continue-on-error: true
        run: |
          python scripts/reconcile_official_eia860_op_totals.py \
            --extract-dir official-extract \
            --output official-extract/independent-op-reconciliation.json
      - name: Independently reconcile generator-level annual capacity bridge
        id: official_check_2
        continue-on-error: true
        run: |
          python scripts/reconcile_official_eia860_transition_bridge.py \
            --extract-dir official-extract \
            --output official-extract/independent-transition-bridge.json
      - name: Independently verify Helms status transition from original workbooks
        id: official_check_3
        continue-on-error: true
        run: |
          python scripts/verify_official_eia860_helms.py \
            --extract-dir official-extract \
            --output official-extract/independent-helms-transition.json
      - name: Cross-check archived 29 entrants against official CISO extracts
        id: official_check_4
        continue-on-error: true
        run: |
          python scripts/verify_official_eia860_29_entrants.py \
            --extract-dir official-extract \
            --output official-extract/independent-29-entrant-crosscheck.json
      - name: Publish machine-readable official-data acceptance receipt
        if: ${{ steps.official_check_1.outcome == 'success' && steps.official_check_2.outcome == 'success' && steps.official_check_3.outcome == 'success' && steps.official_check_4.outcome == 'success' }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path("official-extract")
          inventory = json.loads((root / "independent-op-reconciliation.json").read_text())
          bridge = json.loads((root / "independent-transition-bridge.json").read_text())
          helms = json.loads((root / "independent-helms-transition.json").read_text())
          entrants = json.loads((root / "independent-29-entrant-crosscheck.json").read_text())
          assert entrants["official_extracts_crosschecked"] is True
          assert entrants["record_count"] == 29
          assert entrants["evidence_row_count"] == 29
          assert abs(entrants["op_capacity_mw"] - 138.1) < 0.01
          assert helms["helms_transition_reconciled"] is True
          assert abs(helms["helms_op_delta_mw"] - 1053.0) < 0.01
          import csv
          with (root / "independent-transition-bridge-rows.csv").open(newline="") as stream:
              bridge_rows = list(csv.DictReader(stream))
          helms_rows = [row for row in bridge_rows
                        if row["plant_id_eia"] == "6100" and row["generator_id"] in {"1", "2", "3"}]
          assert len(helms_rows) == 3, "Helms units missing or duplicated in four-way bridge"
          assert all(row["component"] == "status_transitions" for row in helms_rows)
          assert all(row["status_2024"] == "OA" and row["status_2025"] == "OP" for row in helms_rows)
          assert all(abs(float(row["delta_mw"]) - 351.0) < 0.01 for row in helms_rows)
          assert abs(sum(float(row["delta_mw"]) for row in helms_rows) - helms["helms_op_delta_mw"]) < 0.01
          assert inventory["original_workbook_op_totals_reconciled"] is True
          assert bridge["bridge_reconciled"] is True
          assert bridge["row_level_reconciled"] is True
          assert bridge["row_level_rows"] == sum(bridge["component_counts_nonzero"].values())
          assert all(bridge["component_checks"].values())
          assert abs(inventory["op_delta_mw"] - bridge["components_mw"]["net_change"]) <= 0.11
          receipt = {
              "scope": "original_eia860_ciso_op_and_capacity_bridge_only",
              "op_totals_reconciled": True,
              "bridge_components_reconciled": True,
              "row_level_reconciled": True,
              "row_level_rows": bridge["row_level_rows"],
              "yearly_op": inventory["years"],
              "capacity_bridge_mw": bridge["components_mw"],
              "helms_oa_to_op_mw": helms["helms_op_delta_mw"],
              "helms_bridge_rows_crosschecked": True,
              "archived_29_entrant_official_keys_status_capacity_crosschecked": True,
              "operating_year_independently_verified": False,
              "github_repository": os.environ.get("GITHUB_REPOSITORY"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "github_commit_sha": os.environ.get("GITHUB_SHA"),
              "input_archive_sha256": {
                  str(year): hashlib.sha256(pathlib.Path(f"eia860{year}.zip").read_bytes()).hexdigest()
                  for year in (2024, 2025)
              },
              "output_file_sha256": {
                  name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                  for name in (
                      "eia860_ciso_generators_2024.csv",
                      "eia860_ciso_generators_2025.csv",
                      "independent-op-reconciliation.json",
                      "independent-transition-bridge.json",
                      "independent-transition-bridge-rows.csv",
                      "independent-helms-transition.json",
                      "independent-29-entrant-crosscheck.json",
                      "independent-29-entrant-evidence-rows.csv",
                  )
              },
              "fleet_validated": False,
              "ba_mapping_validated": False,
              "empirical_dispatch_approved": False,
          }
          (root / "official-data-acceptance-receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Project A original EIA-860 acceptance receipt\n")
              out.write("OP totals and four-way capacity bridge independently reconciled.\n")
              out.write("**Not** a BA-mapping, full-fleet or dispatch approval.\n")
          print(json.dumps(receipt, indent=2))
          PY
      - name: Retain original-data staging extracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-a-official-eia860-ciso-staging-extracts
          path: official-extract/
          if-no-files-found: ignore
          retention-days: 90
      - name: Enforce fail-closed official-data acceptance after retaining all diagnostics
        if: always()
        env:
          OP_RESULT: ${{ steps.official_check_1.outcome }}
          BRIDGE_RESULT: ${{ steps.official_check_2.outcome }}
          HELMS_RESULT: ${{ steps.official_check_3.outcome }}
          ENTRANTS_RESULT: ${{ steps.official_check_4.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          names = ("OP_RESULT", "BRIDGE_RESULT", "HELMS_RESULT", "ENTRANTS_RESULT")
          outcomes = {name: os.environ.get(name, "unknown") for name in names}
          receipt = pathlib.Path("official-extract/official-data-acceptance-receipt.json")
          accepted = all(value == "success" for value in outcomes.values()) and receipt.exists()
          print(json.dumps({"checks": outcomes, "receipt_exists": receipt.exists(),
                            "official_data_accepted": accepted}, indent=2))
          if not accepted:
              sys.exit("Official EIA-860 acceptance failed; available diagnostics retained")
          PY
      - name: Archive integrity manifest for future audit
        uses: actions/upload-artifact@v4
        with:
          name: project-a-official-eia860-integrity-manifest
          path: official-eia860-integrity-manifest.json
          retention-days: 90
