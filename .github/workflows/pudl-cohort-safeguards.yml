name: Project A PUDL cohort safeguards

on:
  push:
    paths:
      - "data/pudl/project_a_pudl_29_targets.csv"
      - "scripts/pudl_pre2025_entrant_crosscheck.py"
      - "scripts/verify_pudl_targets_against_artifact.py"
      - "tests/test_pudl_pre2025_entrant_crosscheck.py"
      - "tests/test_eia860_source_gates.py"
      - "scripts/verify_eia860_source_gates.py"
      - ".github/workflows/pudl-cohort-safeguards.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cohort-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate 29-row cohort and changelog fixtures
        run: python -m pytest -q tests/test_pudl_pre2025_entrant_crosscheck.py tests/test_eia860_source_gates.py

  archived-source-reconciliation:
    needs: cohort-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download archived fleet transition artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/artifacts/13295023796/zip" \
            > fleet-transition-artifact.zip
          unzip -t fleet-transition-artifact.zip
      - name: Independently reconcile cohort against source artifact
        run: |
          python scripts/verify_pudl_targets_against_artifact.py \
            --artifact fleet-transition-artifact.zip
      - name: Verify source provenance and fail-closed dispatch gates
        run: |
          python scripts/verify_eia860_source_gates.py \
            --artifact fleet-transition-artifact.zip
      - name: Reject tampered source metadata (negative control)
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys, zipfile
          original = pathlib.Path("fleet-transition-artifact.zip")
          modified = pathlib.Path("tampered-fleet-transition-artifact.zip")
          with zipfile.ZipFile(original) as src, zipfile.ZipFile(modified, "w") as dst:
              for name in src.namelist():
                  payload = src.read(name)
                  if name == "2025/source_inventory.json":
                      obj = json.loads(payload)
                      obj["sha256"] = "0" * 64
                      payload = json.dumps(obj).encode()
                  dst.writestr(name, payload)
          result = subprocess.run(
              [sys.executable, "scripts/verify_eia860_source_gates.py",
               "--artifact", str(modified)], capture_output=True, text=True)
          assert result.returncode != 0, "Tampered metadata was incorrectly accepted"
          print("PASS: tampered source SHA256 rejected")
          PY

  official-eia860-archive-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download official 2024 and 2025 EIA-860 archives
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 \
            --max-time 600 \
            "https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602024.zip" \
            --output eia8602024.zip
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 \
            --max-time 600 \
            "https://www.eia.gov/electricity/data/eia860/xls/eia8602025.zip" \
            --output eia8602025.zip
      - name: Verify official archive checksums and ZIP integrity
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '0aaae04812cd4ab87a3e346bdf93848a3cc15053fd4dc2a4cf82d2aeac95f12b' eia8602024.zip \
            '2b27929d26cc1da9ad6a530da1cac6718cd8496098ee560c4d47cfffd96d08ba' eia8602025.zip \
            | sha256sum --check --strict
          unzip -tq eia8602024.zip
          unzip -tq eia8602025.zip
          echo "PASS: official EIA-860 ZIP bytes match pinned SHA256"
