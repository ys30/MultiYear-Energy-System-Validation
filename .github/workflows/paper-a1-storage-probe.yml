name: Paper A1 official storage energy schema
on:
  push:
    paths:
      - ".github/workflows/paper-a1-storage-probe.yml"
      - "scripts/paper_a1_e4_storage_probe.py"
  pull_request:
    paths:
      - ".github/workflows/paper-a1-storage-probe.yml"
      - "scripts/paper_a1_e4_storage_probe.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/paper_a1_e4_storage_probe.py --output-dir results/storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-schema
          path: results/storage/
