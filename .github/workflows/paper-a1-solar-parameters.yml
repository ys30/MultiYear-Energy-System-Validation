name: Paper A1 solar parameter coverage
on:
  pull_request:
    paths:
      - "scripts/paper_a1_e4_solar_parameters.py"
      - ".github/workflows/paper-a1-solar-parameters.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45856946706
          name: renewable-resource-weights
          path: inputs/weights
      - run: python scripts/paper_a1_e4_solar_parameters.py
      - uses: actions/upload-artifact@v4
        with:
          name: solar-parameter-coverage
          path: results/solar_parameters/
