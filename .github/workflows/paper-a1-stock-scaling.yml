name: Paper A1 D1 stock scaling diagnostic
on:
  pull_request:
    paths:
      - "scripts/paper_a1_e4_stock_scaling.py"
      - ".github/workflows/paper-a1-stock-scaling.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46054169186
          name: monthly-stock-reconciliation
          path: inputs/stock
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45951342303
          name: same-fleet-2024
          path: inputs/fleet/2024
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45951342303
          name: same-fleet-2025
          path: inputs/fleet/2025
      - run: python scripts/paper_a1_e4_stock_scaling.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-scaling
          path: results/stock_scaling/
