name: CAISO historical demand cross-check
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/multiyear_energy_validation/caiso_history_audit.py'
      - '.github/workflows/caiso-historical-crosscheck.yml'
permissions:
  contents: read
jobs:
  caiso-demand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect CAISO historical telemetry schema
        run: PYTHONPATH=src python -m multiyear_energy_validation.caiso_history_audit
