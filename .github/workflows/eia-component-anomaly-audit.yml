name: EIA CISO demand component anomaly audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/multiyear_energy_validation/eia_component_audit.py'
      - '.github/workflows/eia-component-anomaly-audit.yml'
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate API secret
        run: test -n "$EIA_API_KEY"
      - name: Query EIA candidate components
        run: PYTHONPATH=src python -m multiyear_energy_validation.eia_component_audit
