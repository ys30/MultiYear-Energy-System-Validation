name: R02 six-site extended physical weather
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/multiyear_energy_validation/extended_physical_weather.py'
      - 'src/multiyear_energy_validation/merge_physical_weather.py'
      - 'src/multiyear_energy_validation/air_density_diagnostic.py'
      - 'src/multiyear_energy_validation/six_site_generator_audit.py'
      - 'src/multiyear_energy_validation/plant_parameter_registry.py'
      - 'tests/test_plant_parameter_registry.py'
      - 'src/multiyear_energy_validation/parameter_evidence_gate.py'
      - 'src/multiyear_energy_validation/pilot_commissioning_screen.py'
      - 'src/multiyear_energy_validation/july2025_validation_cohort.py'
      - 'tests/test_july2025_validation_cohort.py'
      - 'src/multiyear_energy_validation/eia923_monthly_screen.py'
      - 'tests/test_eia923_monthly_screen.py'
      - 'tests/test_parameter_evidence_gate.py'
      - 'tests/test_air_density_diagnostic.py'
      - '.github/workflows/r02-six-site-extended-weather.yml'
permissions:
  contents: read
jobs:
  extended-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . "openpyxl>=3.1,<4"
      - name: Official 2025 EIA-860 renewable plant coordinates
        run: |
          python -m multiyear_energy_validation.eia860_source --year 2025 --output outputs/eia860/2025
          python - <<'PY'
          from multiyear_energy_validation.eia860_renewable_geo import extract_ciso_renewable_locations
          extract_ciso_renewable_locations("outputs/eia860/2025/eia8602025.zip", 2025, "outputs/eia860/2025")
          PY
      - name: Recreate six-site stratified selection and base weather
        run: python -m multiyear_energy_validation.spatial_weather_pilot
      - name: Acquire DNI DHI temperature and surface pressure
        run: python -m multiyear_energy_validation.extended_physical_weather
      - name: Strictly merge base and extended meteorological inputs
        run: python -m multiyear_energy_validation.merge_physical_weather
      - name: Calculate dry-air density at each plant
        run: python -m multiyear_energy_validation.air_density_diagnostic
      - name: Test physical air-density calculations
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_air_density_diagnostic.py
      - name: Audit generator-level EIA technology and nameplate composition
        run: python -m multiyear_energy_validation.six_site_generator_audit
      - name: Generate source-aware plant parameter registry
        run: python -m multiyear_energy_validation.plant_parameter_registry
      - name: Verify parameter registry provenance safeguards
        run: python -m pytest -q tests/test_plant_parameter_registry.py
      - name: Generate plant-specific equipment evidence collection template
        run: python -m multiyear_energy_validation.parameter_evidence_gate
      - name: Test provenance evidence promotion safeguards
        run: python -m pytest -q tests/test_parameter_evidence_gate.py
      - name: Screen generator commissioning dates against July 2025
        run: python -m multiyear_energy_validation.pilot_commissioning_screen
      - name: Construct commissioning-screened July 2025 cohort
        run: python -m multiyear_energy_validation.july2025_validation_cohort
      - name: Test commissioning cohort exclusions
        run: python -m pytest -q tests/test_july2025_validation_cohort.py
      - name: Screen independently sourced EIA-923 monthly generation if reviewed data exists
        run: python -m multiyear_energy_validation.eia923_monthly_screen
      - name: Test monthly generation and availability separation
        run: python -m pytest -q tests/test_eia923_monthly_screen.py
      - uses: actions/upload-artifact@v4
        with:
          name: r02-six-site-extended-weather-2025
          path: |
            outputs/spatial_weather_extended_2025/
            outputs/spatial_weather_merged_2025/
          if-no-files-found: error
          retention-days: 30
