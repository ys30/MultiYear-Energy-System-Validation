name: Paper A1 all-grid weather benchmark
on:
  pull_request:
    paths:
      - ".github/workflows/paper-a1-weather-batch.yml"
      - "scripts/paper_a1_e4_weather_batch.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  batch:
    strategy:
      matrix:
        year: [2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas xarray zarr gcsfs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45856946706
          name: renewable-resource-weights
          path: inputs/weights
      - run: python scripts/paper_a1_e4_weather_batch.py --weights inputs/weights/resource_grid_weights.csv --year ${{ matrix.year }} --output-dir results/batch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-batch-${{ matrix.year }}
          path: results/batch/
