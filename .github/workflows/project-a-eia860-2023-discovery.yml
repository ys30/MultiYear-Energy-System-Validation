name: Project A EIA-860 2023 source discovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/project-a-eia860-2023-discovery.yml"

permissions:
  contents: read

jobs:
  discover-2023-official-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve official 2023 EIA-860 archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 \
            'https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602023.zip' \
            --output eia8602023.zip
          unzip -tq eia8602023.zip
          printf "%s  %s\\n" "1447e23e608bea1523961542a90eb93ea86715067a37f211282541461049b46f" eia8602023.zip | sha256sum --check --strict
      - name: Inspect archive provenance without approving evidence
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          p = pathlib.Path("eia8602023.zip")
          with zipfile.ZipFile(p) as z:
              members = [x.filename for x in z.infolist() if not x.is_dir()]
          assert any("plant" in x.lower() and x.lower().endswith(".xlsx") for x in members), "2023 Plant workbook missing"
          report = {
              "source_url": "https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602023.zip",
              "year": 2023,
              "sha256_observed": hashlib.sha256(p.read_bytes()).hexdigest(),
              "archive_bytes": p.stat().st_size,
              "members": members,
              "status": "discovery_only_not_yet_pinned_or_accepted",
              "fleet_validated": False,
              "ba_mapping_validated": False,
              "empirical_dispatch_approved": False,
          }
          pathlib.Path("eia860-2023-discovery-manifest.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: project-a-eia860-2023-discovery-manifest
          path: eia860-2023-discovery-manifest.json
          retention-days: 90
      - name: Retrieve pinned 2024 and 2025 archives
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602024.zip' -o eia8602024.zip
          curl -fL --retry 3 'https://www.eia.gov/electricity/data/eia860/xls/eia8602025.zip' -o eia8602025.zip
          printf '%s  %s\n' '0aaae04812cd4ab87a3e346bdf93848a3cc15053fd4dc2a4cf82d2aeac95f12b' eia8602024.zip '2b27929d26cc1da9ad6a530da1cac6718cd8496098ee560c4d47cfffd96d08ba' eia8602025.zip | sha256sum --check --strict
      - name: Audit actual 2023 Plant history for 29 records
        run: |
          python -m pip install openpyxl
          python scripts/audit_official_eia860_entrant_ba_history.py \
            --archive-2024 eia8602024.zip --archive-2025 eia8602025.zip \
            --earlier-archive 2023=eia8602023.zip \
            --earlier-sha256 2023=1447e23e608bea1523961542a90eb93ea86715067a37f211282541461049b46f \
            --output project-a-2023-2025-plant-history.json
      - uses: actions/upload-artifact@v4
        with:
          name: project-a-2023-2025-plant-history
          path: |
            project-a-2023-2025-plant-history.json
            independent-29-entrant-plant-ba-rows.csv
          retention-days: 90
