name: EIA full-year CISO candidate intake

on:
  push:
    paths:
      - 'src/multiyear_energy_validation/schema_audit.py'
      - 'src/multiyear_energy_validation/timeseries.py'
      - 'src/multiyear_energy_validation/eia930.py'
      - 'src/multiyear_energy_validation/paper_eia930_coverage_contract.py'
      - 'tests/test_paper_eia930_coverage_contract.py'
      - 'src/multiyear_energy_validation/pypsa_baseline.py'
      - 'src/multiyear_energy_validation/pypsa_load.py'
      - '.github/workflows/eia-full-year-candidate.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 16 3 * *'

permissions:
  contents: read

jobs:
  candidate-year:
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Validate secret
        run: test -n "$EIA_API_KEY"
      - name: Choose year
        id: selection
        env:
          MATRIX_YEAR: ${{ matrix.year }}
        run: |
          echo "year=$MATRIX_YEAR" >> "$GITHUB_OUTPUT"
      - name: Download full-year unverified EIA candidate
        env:
          YEAR: ${{ steps.selection.outputs.year }}
        run: |
          python -m multiyear_energy_validation.download_cli \
            --respondent CISO --start "${YEAR}-01-01T01" --end "$((${YEAR}+1))-01-01T00" \
            --output-dir outputs/eia-ciso-year --max-rows 10000
      - name: Audit actual response schema
        env:
          YEAR: ${{ steps.selection.outputs.year }}
        run: |
          python - <<'PY'
          import json
          from multiyear_energy_validation.schema_audit import audit_candidate_file, audit_period_label_grid, candidate_year_acceptance, audit_candidate_values, candidate_combined_acceptance, diagnose_candidate_invalid_rows, audit_utc_interval_hypotheses, audit_model_year_hour_ending_grid
          report = audit_candidate_file(
              "outputs/eia-ciso-year/eia930_candidate_rows.json",
              "outputs/eia-ciso-year/schema_audit.json")
          print(json.dumps(report, sort_keys=True))
          from pathlib import Path
          import os
          rows = json.loads(Path("outputs/eia-ciso-year/eia930_candidate_rows.json").read_text())
          grid = audit_model_year_hour_ending_grid(rows, year=int(os.environ["YEAR"]))
          Path("outputs/eia-ciso-year/period_label_grid.json").write_text(json.dumps(grid, indent=2))
          print("PERIOD_LABEL_GRID=" + json.dumps(grid, sort_keys=True))
          gate = candidate_year_acceptance(grid)
          Path("outputs/eia-ciso-year/acceptance_gate.json").write_text(json.dumps(gate, indent=2))
          print("CANDIDATE_ACCEPTANCE=" + json.dumps(gate, sort_keys=True))
          values = audit_candidate_values(rows)
          Path("outputs/eia-ciso-year/value_audit.json").write_text(json.dumps(values, indent=2))
          print("CANDIDATE_VALUES=" + json.dumps(values, sort_keys=True))
          combined = candidate_combined_acceptance(grid, values)
          Path("outputs/eia-ciso-year/combined_gate.json").write_text(json.dumps(combined, indent=2))
          print("COMBINED_GATE=" + json.dumps(combined, sort_keys=True))
          diagnosis = diagnose_candidate_invalid_rows(rows)
          Path("outputs/eia-ciso-year/invalid_records.json").write_text(json.dumps(diagnosis, indent=2))
          print("INVALID_RECORD_DIAGNOSIS=" + json.dumps(diagnosis, sort_keys=True))
          boundaries = audit_utc_interval_hypotheses(rows, year=int(os.environ["YEAR"]))
          Path("outputs/eia-ciso-year/interval_hypotheses.json").write_text(json.dumps(boundaries, indent=2))
          print("INTERVAL_HYPOTHESES=" + json.dumps(boundaries, sort_keys=True))
          if combined["raw_candidate_eligible_for_semantic_review"]:
              from multiyear_energy_validation.eia_normalize import normalize_candidate_rows
              from multiyear_energy_validation.coverage import audit_coverage_csv
              normalized = Path("outputs/eia-ciso-year/normalized_utc_demand.csv")
              normalize_candidate_rows(rows, normalized, respondent="CISO",
                                       period_is_utc_interval_end=True,
                                       period_frequency="hourly")
              coverage = audit_coverage_csv(normalized, year=int(os.environ["YEAR"]),
                                            timestamp_column="time_utc",
                                            demand_column="demand_mw",
                                            region_column="balancing_authority", region="CISO")
              Path("outputs/eia-ciso-year/normalized_coverage.json").write_text(json.dumps(coverage, indent=2))
              print("NORMALIZED_COVERAGE=" + json.dumps(coverage, sort_keys=True))
              if coverage["complete"]:
                  from multiyear_energy_validation.pypsa_load import build_pypsa_load_profile
                  load = build_pypsa_load_profile(
                      normalized, Path("outputs/eia-ciso-year/pypsa_load_profile.csv"),
                      year=int(os.environ["YEAR"]), region="CISO")
                  Path("outputs/eia-ciso-year/pypsa_load_manifest.json").write_text(json.dumps(load, indent=2))
                  print("PYPSA_LOAD_MANIFEST=" + json.dumps(load, sort_keys=True))
          PY
      - name: Export verified year-specific paper demand coverage
        if: matrix.year == 2024 || matrix.year == 2025
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from multiyear_energy_validation.paper_eia930_coverage_contract import audit_single_year
          root=Path("outputs/eia-ciso-year")
          report=json.loads((root/"normalized_coverage.json").read_text())
          result=audit_single_year(report,int(os.environ["YEAR"]))
          (root/"paper_demand_coverage.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\\n",encoding="utf-8")
          print("PAPER_DEMAND_COVERAGE="+json.dumps(result,sort_keys=True))
          PY
      - name: R02a audited hourly load diagnostics
        if: matrix.year == 2024 || matrix.year == 2025
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from multiyear_energy_validation.eia930 import audit_csv
          root = Path("outputs/eia-ciso-year")
          normalized = root / "normalized_utc_demand.csv"
          if not normalized.exists():
              raise RuntimeError("R02a blocked: vetted normalized hourly demand missing")
          year = int(os.environ["YEAR"])
          report = audit_csv(normalized, year=year,
                             timestamp_column="time_utc",
                             demand_column="demand_mw",
                             region_column="balancing_authority", region="CISO")
          report["data_scope"] = "EIA-930 normalized observed CISO demand"
          report["empirical_dispatch_ready"] = False
          (root / "r02a_hourly_load_quality.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print("R02A_HOURLY_LOAD_QUALITY=" + json.dumps(report, sort_keys=True))
          from multiyear_energy_validation.ramp_source_audit import audit_raw_hour
          raw_rows = json.loads((root / "eia930_candidate_rows.json").read_text())
          audits = [
              audit_raw_hour(raw_rows, hour_start_utc=flag["timestamp_utc"],
                             observed_mw=flag["observed_mw"])
              for flag in report["isolated_single_hour_flags"]
          ]
          (root / "r02a_raw_source_audit.json").write_text(
              json.dumps(audits, indent=2) + "\n", encoding="utf-8")
          print("R02A_RAW_SOURCE_AUDIT=" + json.dumps(audits, sort_keys=True))
          PY
      - name: Install optional PyPSA for load-only network smoke test
        if: matrix.year == 2024 || matrix.year == 2025
        run: python -m pip install "pypsa>=0.35,<2"
      - name: Build and round-trip PyPSA load-only network
        if: matrix.year == 2024 || matrix.year == 2025
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from multiyear_energy_validation.pypsa_baseline import build_load_only_network
          root = Path("outputs/eia-ciso-year")
          manifest = build_load_only_network(root / "pypsa_load_profile.csv",
                                             root / "pypsa_load_only.nc")
          assert manifest["snapshots"] == (8784 if int(__import__("os").environ["YEAR"]) == 2024 else 8760)
          (root / "pypsa_network_manifest.json").write_text(json.dumps(manifest, indent=2))
          print("PYPSA_NETWORK_ROUNDTRIP=" + json.dumps(manifest, sort_keys=True))
          from multiyear_energy_validation.pypsa_baseline import solve_synthetic_balance_smoke_test
          synthetic = solve_synthetic_balance_smoke_test(root / "pypsa_load_profile.csv", snapshots=24)
          (root / "synthetic_optimization_smoke.json").write_text(json.dumps(synthetic, indent=2))
          print("SYNTHETIC_OPTIMIZATION_SMOKE=" + json.dumps(synthetic, sort_keys=True))
          PY
      - name: Upload private candidate and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eia-ciso-full-year-candidate-${{ steps.selection.outputs.year }}
          path: outputs/eia-ciso-year/
          if-no-files-found: warn
          retention-days: 30
