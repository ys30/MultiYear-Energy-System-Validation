name: Paper A1 official EIA930 bulk probe
on:
  push:
    paths:
      - ".github/workflows/paper-a1-bulk-probe.yml"
      - "scripts/paper_a1_e4_bulk_probe.py"
  pull_request:
    paths:
      - ".github/workflows/paper-a1-bulk-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/paper_a1_e4_bulk_probe.py --output-dir results/bulk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia930-bulk-probe
          path: results/bulk/
