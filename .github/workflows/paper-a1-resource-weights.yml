name: Paper A1 renewable spatial weights
on:
  pull_request:
    paths:
      - ".github/workflows/paper-a1-resource-weights.yml"
      - "scripts/paper_a1_e4_resource_weights.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weights:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas duckdb
      - run: python scripts/paper_a1_e4_resource_weights.py --output-dir results/weights
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renewable-resource-weights
          path: results/weights/
