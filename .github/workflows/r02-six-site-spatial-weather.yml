name: R02 six-site spatial weather pilot
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/multiyear_energy_validation/spatial_weather_pilot.py'
      - 'src/multiyear_energy_validation/spatial_weather_pairwise.py'
      - '.github/workflows/r02-six-site-spatial-weather.yml'
permissions:
  contents: read
jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . "openpyxl>=3.1,<4"
      - name: Retrieve official EIA-860 2025 CISO renewable coordinates
        run: |
          python -m multiyear_energy_validation.eia860_source --year 2025 --output outputs/eia860/2025
          python - <<'PY'
          from multiyear_energy_validation.eia860_renewable_geo import extract_ciso_renewable_locations
          extract_ciso_renewable_locations("outputs/eia860/2025/eia8602025.zip", 2025, "outputs/eia860/2025")
          PY
      - name: Retrieve and validate six-site July NASA POWER weather
        run: python -m multiyear_energy_validation.spatial_weather_pilot
      - name: Evaluate all six within-technology site pairs
        run: python -m multiyear_energy_validation.spatial_weather_pairwise
      - uses: actions/upload-artifact@v4
        with:
          name: r02-six-site-spatial-weather-2025
          path: outputs/spatial_weather_pilot_2025/
          if-no-files-found: error
          retention-days: 30
