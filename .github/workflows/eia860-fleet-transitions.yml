name: EIA-860 year-to-year fleet transitions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia860-fleet-transitions.yml'
      - 'src/multiyear_energy_validation/eia860_transitions.py'
      - 'src/multiyear_energy_validation/eia860_fleet.py'
      - 'src/multiyear_energy_validation/eia860_source.py'
      - 'tests/test_eia860_transitions.py'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test]" "openpyxl>=3.1,<4"
      - run: python -m pytest -q tests/test_eia860_transitions.py
      - name: Intake and audit both official annual archives
        run: |
          for year in 2024 2025; do
            python -m multiyear_energy_validation.eia860_source --year "$year" --output "outputs/eia860/$year"
            YEAR="$year" python - <<'PY'
          import os
          from multiyear_energy_validation.eia860_fleet import audit_ciso_operable
          y = int(os.environ["YEAR"])
          audit_ciso_operable(f"outputs/eia860/{y}/eia860{y}.zip", y, f"outputs/eia860/{y}")
          PY
          done
      - name: Reconcile generator-level annual transitions
        run: |
          python -m multiyear_energy_validation.eia860_transitions             --previous outputs/eia860/2024/ciso_operable_generators.csv             --current outputs/eia860/2025/ciso_operable_generators.csv             --output outputs/eia860/fleet_transitions_2024_2025.json
      - name: Publish bounded summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("outputs/eia860/fleet_transitions_2024_2025.json").read_text())
          keys = ("classification_counts", "op_previous_nameplate_mw",
                  "op_current_nameplate_mw", "op_delta_nameplate_mw",
                  "op_delta_by_classification_mw", "op_delta_by_technology_mw",
                  "transition_counts_by_classification_and_technology",
                  "status_transitions_by_technology",
                  "inventory_membership_operating_year_counts",
                  "entrant_operating_year_cohorts")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## CISO annual generator identity comparison\n\n")
              f.write("Inventory identity changes do not establish commissioning or retirement.\n\n")
              for key in keys:
                  f.write(f"- **{key}:** `{data[key]}`\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ciso-eia860-fleet-transitions
          path: |
            outputs/eia860/fleet_transitions_2024_2025.json
            outputs/eia860/2024/source_inventory.json
            outputs/eia860/2025/source_inventory.json
          retention-days: 30
