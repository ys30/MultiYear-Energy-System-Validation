name: R02 actual CISO plant weather pilot
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/multiyear_energy_validation/actual_plant_weather_pilot.py'
      - '.github/workflows/r02-actual-plant-weather.yml'
permissions:
  contents: read
jobs:
  actual-plants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . "openpyxl>=3.1,<4"
      - name: Download official EIA-860 2025 and geocode CISO renewables
        run: |
          python -m multiyear_energy_validation.eia860_source --year 2025 --output outputs/eia860/2025
          python - <<'PY'
          from multiyear_energy_validation.eia860_renewable_geo import extract_ciso_renewable_locations
          extract_ciso_renewable_locations("outputs/eia860/2025/eia8602025.zip", 2025, "outputs/eia860/2025")
          PY
      - name: Acquire 72-hour NASA POWER observations at four real plant coordinates
        run: python -m multiyear_energy_validation.actual_plant_weather_pilot
      - uses: actions/upload-artifact@v4
        with:
          name: r02-real-ciso-plant-weather-pilot
          path: outputs/actual_plant_weather_2025/
          if-no-files-found: error
          retention-days: 30
