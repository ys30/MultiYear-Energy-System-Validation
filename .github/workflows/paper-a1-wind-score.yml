name: Paper A1 wind sensitivity scoring
on:
  pull_request:
    paths:
      - ".github/workflows/paper-a1-wind-score.yml"
      - "scripts/paper_a1_e4_wind_sensitivity_score.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  score:
    strategy:
      matrix:
        year: [2024, 2025]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45856946706
          name: renewable-resource-weights
          path: inputs/weights
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45864227705
          name: wind-sensitivity-${{ matrix.year }}
          path: inputs/wind
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45757723985
          path: inputs/observed
      - run: |
          OBS=$(find inputs/observed -name reconciled.csv)
          test -f "$OBS"
          python scripts/paper_a1_e4_wind_sensitivity_score.py --wind inputs/wind/wind_sensitivity.csv --weights inputs/weights/resource_grid_weights.csv --observed "$OBS" --year ${{ matrix.year }} --output-dir results/score
      - uses: actions/upload-artifact@v4
        with:
          name: wind-score-${{ matrix.year }}
          path: results/score/
