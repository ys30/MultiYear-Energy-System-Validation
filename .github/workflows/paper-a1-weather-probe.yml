name: Paper A1 independent weather resource probe
on:
  pull_request:
    paths:
      - ".github/workflows/paper-a1-weather-probe.yml"
      - "scripts/paper_a1_e4_weather_probe.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy xarray zarr gcsfs
      - run: python scripts/paper_a1_e4_weather_probe.py --output-dir results/weather
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-weather-probe
          path: results/weather/
