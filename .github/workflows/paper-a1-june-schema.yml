name: Paper A1 D1 June stock schema
on:
  pull_request:
    paths:
      - "scripts/paper_a1_e4_june_schema.py"
      - ".github/workflows/paper-a1-june-schema.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl
      - run: python scripts/paper_a1_e4_june_schema.py
      - uses: actions/upload-artifact@v4
        with:
          name: june-stock-schema
          path: results/june_schema/
