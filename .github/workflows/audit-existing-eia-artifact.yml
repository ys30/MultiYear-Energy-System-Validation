name: Audit existing EIA candidate artifact

on:
  push:
    paths:
      - 'src/multiyear_energy_validation/schema_audit.py'
      - '.github/workflows/audit-existing-eia-artifact.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful EIA candidate intake run ID"
        required: true
        default: "41529332150"

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research package
        run: python -m pip install -e .
      - name: Retrieve candidate artifact from earlier run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id || '41529332150' }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name eia-candidate-unverified --dir outputs/eia-existing
      - name: Inspect actual EIA response fields
        run: |
          python - <<'PY'
          import json
          from multiyear_energy_validation.schema_audit import audit_candidate_file
          r = audit_candidate_file(
              "outputs/eia-existing/eia930_candidate_rows.json",
              "outputs/eia-existing/schema_audit.json",
          )
          print(json.dumps(r, sort_keys=True, indent=2))
          PY
      - name: Archive schema-only audit
        uses: actions/upload-artifact@v4
        with:
          name: eia-schema-audit-existing
          path: outputs/eia-existing/schema_audit.json
          retention-days: 30
